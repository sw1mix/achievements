<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Достижения</title>
  <meta name="description" content="Минималистичный трекер достижений: неделя, месяц, год и статистика.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23111' stroke-width='3'/%3E%3Cpath d='M10 16.5l4 4 8-8' fill='none' stroke='%23111' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="topbar__title">Достижения</h1>
    <div class="topbar__actions">
      <button class="btn btn--ghost" id="export-btn" type="button">Экспорт</button>
      <button class="btn btn--ghost" id="import-btn" type="button">Импорт</button>
      <button class="btn btn--icon" id="theme-btn" type="button" title="Сменить тему" aria-label="Сменить тему">☾</button>
      <input class="visually-hidden" id="import-file" type="file" accept="application/json">
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="periodbar">
        <div class="segmented" role="group" aria-label="Период">
          <button class="segmented__btn" data-mode="week" type="button">Неделя</button>
          <button class="segmented__btn" data-mode="month" type="button">Месяц</button>
        </div>
        <div class="periodbar__nav">
          <button class="btn btn--icon" id="prev-period" type="button" aria-label="Назад">‹</button>
          <div class="periodbar__label">
            <span class="periodbar__range" id="period-range"></span>
            <span class="periodbar__sub muted" id="period-sub"></span>
          </div>
          <button class="btn btn--icon" id="next-period" type="button" aria-label="Вперёд">›</button>
        </div>
        <button class="btn btn--ghost" id="today-btn" type="button">Сегодня</button>
      </div>

      <div class="grid-scroll">
        <div class="grid" id="grid"></div>
      </div>

      <form class="add" id="add-form" autocomplete="off">
        <button class="habit-badge add__badge" id="add-badge" type="button"
                title="Значок, цвет и цель" aria-label="Настроить значок нового достижения"></button>
        <input class="add__input" id="add-input" type="text" maxlength="40"
               placeholder="Новое достижение — например, «Тренировка»">
        <button class="btn" type="submit">Добавить</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel__head">
        <h2 class="panel__title">Статистика периода</h2>
        <span class="muted" id="summary-line" aria-live="polite"></span>
      </div>
      <div class="charts" id="charts"></div>
    </section>

    <section class="panel">
      <div class="panel__head">
        <h2 class="panel__title">Ритм</h2>
        <span class="muted">последние 12 недель</span>
      </div>
      <div class="rhythm">
        <figure class="rhythm__item">
          <div id="weekday-rose"></div>
          <figcaption class="chart__sub">По дням недели</figcaption>
        </figure>
        <figure class="rhythm__item rhythm__item--wide">
          <div class="bars" id="week-bars"></div>
          <figcaption class="chart__sub">По неделям</figcaption>
        </figure>
      </div>
    </section>

    <section class="panel">
      <div class="panel__head">
        <h2 class="panel__title">Год</h2>
        <div class="yearnav">
          <button class="btn btn--icon" id="prev-year" type="button" aria-label="Предыдущий год">‹</button>
          <span id="year-label"></span>
          <button class="btn btn--icon" id="next-year" type="button" aria-label="Следующий год">›</button>
        </div>
      </div>
      <div class="heatmap-scroll">
        <div class="heatmap" id="heatmap"></div>
      </div>
      <div class="heatmap__legend muted">
        <span>Меньше</span>
        <span class="hm-cell" data-level="0"></span>
        <span class="hm-cell" data-level="1"></span>
        <span class="hm-cell" data-level="2"></span>
        <span class="hm-cell" data-level="3"></span>
        <span class="hm-cell" data-level="4"></span>
        <span>Больше</span>
      </div>
    </section>

    <section class="panel" id="archive-panel" hidden>
      <div class="panel__head">
        <h2 class="panel__title">Архив</h2>
        <span class="muted" id="archive-count"></span>
      </div>
      <div class="archive" id="archive-list"></div>
    </section>
  </main>

  <footer class="footer muted">
    <div>Данные хранятся только в этом браузере — localStorage.</div>
    <div>Клавиши: ←/→ — период, T — сегодня, W/M — неделя или месяц</div>
  </footer>

  <div class="popover" id="popover" role="dialog" aria-label="Настройка достижения" hidden></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
